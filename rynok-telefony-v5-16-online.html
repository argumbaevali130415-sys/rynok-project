function numAt(i){const r=i%100,q=(i-r)/100;let t;if(q%40==0&&q<2400){const k=q/40,d=k%10,D=String(d);t=[D.repeat(7),'000'+D.repeat(4),D.repeat(3)+'0000','777'+D.repeat(4),Array.from({length:7},(_,j)=>(d+j)%10).join(''),[d,(d+3)%10,(d+5)%10,(d+7)%10,(d+5)%10,(d+3)%10,d].join('')][(k/10|0)%6]}else t=String((q*7919+31337)%10000000).padStart(7,'0');return (900+r)+t}
function nprice(n){const f=NUMS.find(z=>z[0]==n);if(f)return f[1];const s=n.replace(/\D/g,'');let mr=1,c=1,lad=1,cl=1;for(let i=1;i<s.length;i++){c=s[i]==s[i-1]?c+1:1;if(c>mr)mr=c;cl=(+s[i]-+s[i-1]+10)%10==1?cl+1:1;if(cl>lad)lad=cl}const z=(s.match(/0/g)||[]).length,t=s.slice(3),pal=t==[...t].reverse().join('');return R((300+[0,0,0,1200,6000,18000,40000,70000,90000,95000,95000][mr]+(lad>=5?lad*1500:0)+(pal?6000:0)+(z>=6?5000:0))*(1+(+s.slice(-2)%7)/50))}
function nScan(target){const m=S.nm;let i=m.pos;for(;i<NN&&m.res.length<target;i++){const s=numAt(i);if(s.indexOf(m.q)>=0)m.res.push(fmtN(s))}m.pos=i}
const nNew=(o)=>S.nm=Object.assign({mode:'top',q:'',res:[],pos:0,n:0,off:0},o);
function nSearch(){const q=($('#nq').value||'').replace(/\D/g,'');if(!q)return toast('Введите цифры для поиска');nNew({mode:'find',q});simOpen()}
function nMode(k){nNew({mode:k});simOpen()}
function nRand(){const tot=S.nm.mode=='pretty'?6000:NN;nNew({mode:S.nm.mode=='top'?'all':S.nm.mode,off:Math.floor(Math.random()*tot)});simOpen()}
const nRow=n=>{const p=nprice(n);return `<div class='row' style='margin-top:6px;gap:8px'><span><b>+7 ${n}</b><div class='mut'>${p>=18000?'👑 Премиум':p>=3000?'💎 Красивый':'Обычный'}</div></span><button class='b' onclick='buyNum("${n}")'>${fmt(p)}</button></div>`};
function nRows(k){const m=S.nm;let a=[];if(m.mode=='top'){a=NUMS.map(z=>z[0]);m.n=a.length}else if(m.mode=='find'){if(m.res.length<m.n+k)nScan(m.n+k);a=m.res.slice(m.n,m.n+k);m.n+=a.length}else{const tot=m.mode=='pretty'?6000:NN;for(let j=0;j<k;j++){const x=(m.off+m.n+j)%tot;a.push(fmtN(numAt(m.mode=='pretty'?40*((x/100)|0)*100+x%100:x)))}m.n+=k}return a.filter(n=>!S.nums.includes(n)).map(nRow).join('')}
function nScroll(el){if(S.nm.mode=='top'||el.scrollTop+el.clientHeight<el.scrollHeight-300)return;const l=$('#nl');if(l)l.insertAdjacentHTML('beforeend',nRows(20))}
function nShop(){const m=S.nm,ch=(k,t)=>`<button class='b ${m.mode==k?'g':'l'}' style='padding:6px 10px' onclick='nMode("${k}")'>${t}</button>`,rows=nRows(20);
return `<div class='tags'>${ch('top','👑 Витрина')}${ch('all','Все')}${ch('pretty','💎 Красивые')}${m.mode=='top'?'':`<button class='b l' style='padding:6px 10px' onclick='nRand()'>🎲 Случайные</button>`}</div><div class='row' style='gap:8px;margin:8px 0'><input id='nq' value='${m.q||''}' inputmode='numeric' placeholder='Найти по цифрам, например 777' onkeydown="if(event.key=='Enter')nSearch()" style='flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:600 15px inherit'><button class='b' onclick='nSearch()'>🔍</button></div><div id='nl'>${rows||'<div class="empty">Ничего не найдено</div>'}</div>${m.mode=='top'?'':'<div class="empty">Листайте вниз — подгружаем ещё…</div>'}`}
let BESTN=null;const bestNum=()=>{if(!BESTN){let b=NUMS[0][0],bp=nprice(b);NUMS.forEach(z=>{if(z[1]>bp){b=z[0];bp=z[1]}});for(let x=0;x<6000;x++){const n=fmtN(numAt(40*((x/100)|0)*100+x%100)),p=nprice(n);if(p>bp){b=n;bp=p}}BESTN=b}return BESTN};
const lensBlock=i=>{const L=LENS.find(x=>x[0]==i.lens);return `<div class='mut' style='margin:6px 0'>🔭 Объектив: <b>${L?L[1]+' ×'+L[3]:'нет'}</b> <button class='b l' style='padding:4px 10px;font-size:12px' onclick='lensPick(${i.id})'>${L?'Сменить':'Закрутить'}</button></div>`};
function lensPick(pid){if(!S.lenses.length)return toast('Сначала купите объектив во вкладке «🔭Зум»');const i=S.inv.find(x=>x.id==pid),e=$('#bench');e.style.display='flex';e.innerHTML=`<div style='background:var(--card);color:var(--ink);border-radius:18px;max-width:440px;width:100%;max-height:97vh;overflow:auto;padding:14px'><div class='row'><b style='font-size:17px'>🔭 Объектив для ${M[i.m].n}</b><button class='b l' onclick='closeBench()'>✕</button></div>${S.lenses.map(id=>{const L=LENS.find(x=>x[0]==id),on=S.inv.find(x=>x.lens==id);return `<div class='row' style='margin-top:8px;gap:8px'><span><b>${L[1]}</b><div class='mut'>до ×${L[3]}${on?' · сейчас на '+M[on.m].n:''}</div></span><button class='b g' onclick='lensMount("${id}",${pid})'>Закрутить</button></div>`}).join('')}</div>`}
/* ===== аккаунты и надёжное сохранение ===== */
let ACC=null;
const WNget=()=>{try{const o=JSON.parse(window.name);return o&&o.__bu?o:{__bu:1}}catch(e){return{__bu:1}}};
function sget(k){try{const v=localStorage.getItem(k);if(v!=null)return v}catch(e){}const v=WNget()[k];return v==null?null:v}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}try{const o=WNget();o[k]=v;window.name=JSON.stringify(o)}catch(e){}}
function sdel(k){try{localStorage.removeItem(k)}catch(e){}try{const o=WNget();delete o[k];window.name=JSON.stringify(o)}catch(e){}}
const AC=()=>{try{return JSON.parse(sget('bu_accts')||'{}')}catch(e){return{}}},hsh=s=>{let x=5381;for(const c of s)x=(x*33^c.charCodeAt(0))>>>0;return x.toString(36)};
const SKEYS=['money','day','mk','id','won','parts','tools','sol','scope','dryer','laps','rep','sales','profit','fl','scam','ach','skill','inv','sort','promo','vib','lenses','nums'];
const AIN="width:100%;margin-bottom:8px;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;font:600 15px inherit";
function authScreen(){let e=$('#auth');if(!e){e=document.createElement('div');e.id='auth';e.style.cssText='position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto';document.body.appendChild(e)}
const old=sget('bu_save'),first=!Object.keys(AC()).length;e.innerHTML=`<div style="background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:380px;width:100%;padding:18px;color:var(--ink)"><b style="font-size:20px">📱 Б/У Рынок</b><div class="mut" style="margin:6px 0 12px">Войдите или создайте аккаунт: прогресс сохранится и не обнулится при обновлении страницы.${old&&first?'<br>🎒 Найден прежний прогресс — он перейдёт в ваш новый аккаунт.':''}</div><input id="al" placeholder="Логин" autocomplete="username" style="${AIN}"><input id="ap" type="password" placeholder="Пароль" autocomplete="current-password" style="${AIN}" onkeydown="if(event.key=='Enter')authGo(0)"><div id="am" style="color:var(--acc);min-height:20px;margin:2px 0 8px"></div><div class="row" style="gap:8px"><button class="b g" style="flex:1" onclick="authGo(0)">Войти</button><button class="b" style="flex:1" onclick="authGo(1)">Создать аккаунт</button></div><details style="margin-top:12px"><summary class="mut" style="cursor:pointer">🔁 Перенести аккаунт из другой версии</summary><div class="mut" style="margin:6px 0">В старой версии: 👤 Аккаунт → «Код сохранения» (или «Код ВСЕХ аккаунтов»). Вставьте код сюда. Для кода одного аккаунта впишите выше тот же логин и пароль.</div><textarea id="ar" rows="3" placeholder="Код" style="${AIN};font-size:12px"></textarea><button class="b l" style="width:100%" onclick="authRestore()">⬆ Восстановить из кода</button></details></div>`}
function authRestore(){const bad=m=>{$('#am').textContent=m};try{const o=JSON.parse(decodeURIComponent(escape(atob(($('#ar').value||'').trim()))));if(o&&o.acc&&o.saves){const[n,b]=mergeAll(o);return bad('✅ Восстановлено аккаунтов: '+n+(b?'; отклонено изменённых: '+b:'')+'. Теперь войдите.')}if(!o||!Array.isArray(o.inv))throw 0;if(!codeOk(o))return bad('❌ Код изменён вручную или значения нереальны');const l=($('#al').value||'').trim().slice(0,20),p=$('#ap').value||'';if(l.length<3||p.length<4)return bad('Впишите логин (от 3) и пароль (от 4 символов) для этого аккаунта');const A=AC(),h=hsh(l+':'+l.length+p);if(A[l]&&A[l]!==h)return bad('Логин занят, пароль не подходит');A[l]=h;sset('bu_accts',JSON.stringify(A));sealSet(l,JSON.stringify({...o,L:[],fav:[]}));authGo(0)}catch(e){bad('❌ Неверный код')}}
function allCode(){save();const A=AC(),sv={},sg={};for(const l in A){const v=sget('bu_acc_'+l);if(!v)continue;const z=sget('bu_sig_'+l);let ok=false;try{ok=z?z===sig(l+v):sane(JSON.parse(v))}catch(e){}if(ok){sv[l]=v;sg[l]=sig(l+v)}}const t=btoa(unescape(encodeURIComponent(JSON.stringify({acc:A,saves:sv,sigs:sg}))));accOpen('Код ВСЕХ аккаунтов. Сохраните его в заметках:');$('#ac').value=t;$('#ac').select()}
function authGo(c){const bad=m=>{$('#am').textContent=m},l=($('#al').value||'').trim().slice(0,20),p=$('#ap').value||'',A=AC();if(l.length<3)return bad('Логин от 3 символов');if(p.length<4)return bad('Пароль от 4 символов');const h=hsh(l+':'+l.length+p);
if(c){if(A[l])return bad('Такой логин уже есть');const first=!Object.keys(A).length,old=sget('bu_save');A[l]=h;sset('bu_accts',JSON.stringify(A));if(first&&old)sset('bu_acc_'+l,old)}else{if(lockLeft('bu_alock'))return bad('⏳ Слишком много попыток. Подождите '+lockLeft('bu_alock')+' с');if(A[l]!==h){failHit('bu_alock');return bad('Неверный логин или пароль')}}
ACC=l;sset('bu_last',l);load();$('#auth').remove();S.inv.forEach(i=>i.listed=0);render();olSetup();toast((c?'Аккаунт создан: ':'Вы вошли: ')+l)}
const accChip=()=>`<div class="st" onclick="accOpen()" style="cursor:pointer;min-width:70px;flex:0 0 auto;text-align:center"><small>Аккаунт</small><b>👤 ${(ACC||'').slice(0,8)}</b></div>`;
function accOpen(m){const e=$('#bench');e.style.display='flex';e.innerHTML=`<div style="background:var(--card);color:var(--ink);border-radius:18px;max-width:440px;width:100%;max-height:97vh;overflow:auto;padding:14px"><div class="row"><b style="font-size:17px">👤 Аккаунт: ${ACC}</b><button class="b l" onclick="closeBench()">✕</button></div><p class="mut">Прогресс сохраняется автоматически и остаётся после обновления страницы.</p><button class="b l" style="width:100%;margin-bottom:8px" onclick="accCode()">📋 Код сохранения (резервная копия)</button><button class="b l" style="width:100%;margin-bottom:8px" onclick="allCode()">📦 Код ВСЕХ аккаунтов (для переноса)</button><textarea id="ac" rows="3" placeholder="Вставьте код сюда, чтобы загрузить прогресс" style="${AIN};font-size:12px"></textarea><button class="b g" style="width:100%;margin-bottom:8px" onclick="accLoad()">⬆ Загрузить из кода</button><div id="amsg" class="mut" style="margin-bottom:8px">${m||''}</div><button class="b l" style="width:100%" onclick="sdel('bu_last');location.reload()">🚪 Выйти из аккаунта</button></div>`}
function accCode(){const o={};SKEYS.forEach(k=>o[k]=S[k]);o._s=sig(JSON.stringify(o));const t=btoa(unescape(encodeURIComponent(JSON.stringify(o))));accOpen('Скопируйте код ниже и сохраните его в заметках:');$('#ac').value=t;$('#ac').select()}
function accLoad(){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#ac').value.trim()))));if(o&&o.acc&&o.saves){const[n,b]=mergeAll(o);return accOpen('✅ Аккаунтов перенесено: '+n+(b?'; отклонено изменённых: '+b:'')+'. Выйдите и войдите заново.')}if(!o||!Array.isArray(o.inv))throw 0;if(!codeOk(o))return accOpen('❌ Код изменён вручную или значения нереальны');SKEYS.forEach(k=>{if(o[k]!==undefined)S[k]=o[k]});S.inv=S.inv.filter(i=>M[i.m]);S.parts=(S.parts||[]).filter(p=>M[p.m]);save();location.reload()}catch(e){accOpen('❌ Неверный код')}}
ACC=sget('bu_last');if(ACC&&!AC()[ACC])ACC=null;
if(ACC&&load())toast('Прогресс восстановлен');render();if(!ACC)authScreen();


/* ===== ONLINE MARKET (shared db, no bots) ===== */
const OL={ok:0,list:[],pd:{},raw:'',t:0};
const olBase=()=>{let v='';try{v=(sget('bu_server')||'').trim()}catch(e){}if(!v&&/^https?:/.test(location.protocol))v=location.origin;return v.replace(/\/+$/,'')};
const olPid=()=>{const k='bu_pid_'+ACC;let p=sget(k);if(!p||!/^[a-f0-9]{32}$/.test(p)){const a=new Uint8Array(16);if(crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<16;i++)a[i]=Math.random()*256;p=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');sset(k,p)}return p};
async function olApi(path,body){const h={'content-type':'application/json'};if(ACC)h['x-pid']=olPid();const r=await fetch(olBase()+path,{method:body===undefined?'GET':'POST',headers:h,body:body===undefined?undefined:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'http'),{code:r.status,msg:j.error});return j}
function olSet(list){const raw=JSON.stringify(list),was=OL.ok;OL.ok=1;OL.t=Date.now();if(raw===OL.raw&&was)return;OL.raw=raw;OL.list=list;olPay();if(S.tab=='feed'&&!(document.activeElement&&document.activeElement.id=='ols'))render()}
function olInit(){const b=olBase();if(!b)return;const poll=()=>olApi('/api/market').then(j=>olSet(j.list||[])).catch(()=>{if(OL.ok&&Date.now()-OL.t>25000){OL.ok=0;if(S.tab=='feed')render()}});poll();setInterval(poll,10000);try{const es=new EventSource(b+'/api/stream');es.onmessage=e=>{try{olSet(JSON.parse(e.data))}catch(_){}}}catch(e){}}
async function olSetup(){if(!ACC||!olBase())return;try{const j=await olApi('/api/hello',{});OL.me=j.pub;olPay();if(S.tab=='feed')render()}catch(e){}}
function olPay(){if(!ACC||!OL.ok||!OL.me)return;OL.list.filter(l=>l.sold&&l.seller==OL.me&&!OL.pd[l.id]).forEach(l=>{OL.pd[l.id]=1;olApi('/api/payout/'+encodeURIComponent(l.id),{}).then(j=>{S.money+=j.ask;onSale(j.ask,{paid:(l.item&&+l.item.paid)||0});save();toast('💰 Ваш телефон купили: +'+fmt(j.ask));render()}).catch(e=>{if(!(e.code>=400&&e.code<500))delete OL.pd[l.id]})})}
function listIt(id){const it=S.inv.find(i=>i.id==id),p=Math.round(+$('#p'+id).value);if(!it||!(p>0))return;if(!OL.ok||!OL.me)return toast('🌐 Нет связи с сервером онлайн-рынка');const snap=JSON.parse(JSON.stringify(it));delete snap.id;delete snap.listed;delete snap.ask;olApi('/api/list',{ask:p,item:snap}).then(()=>{S.inv=S.inv.filter(x=>x!=it);S.tab='feed';save();toast('🌐 Выставлено на онлайн-рынок');olApi('/api/market').then(j=>olSet(j.list||[])).catch(()=>{});render()}).catch(e=>toast(e.msg||'Не удалось выставить'))}
async function olCancel(lid){try{const j=await olApi('/api/cancel/'+encodeURIComponent(lid),{});S.inv.push({...j.item,id:S.id++,listed:0});save();toast('Снято с продажи');render()}catch(e){toast(e.code==409?'Уже куплено':'Ошибка')}}
async function olBuy(lid){const l=OL.list.find(x=>x.id==lid);if(!l||l.sold)return;if(!OL.me)return toast('Нет связи с сервером');if(l.seller==OL.me)return toast('Это ваше объявление');if(S.money<l.ask)return toast('Не хватает денег');try{const j=await olApi('/api/buy/'+encodeURIComponent(lid),{});S.money-=j.ask;S.inv.push({...j.item,id:S.id++,paid:j.ask,listed:0,view:'back'});S.tab='inv';save();toast('Куплено: '+(M[j.item.m]?M[j.item.m].n:'телефон'));render()}catch(e){toast(e.code==409?'Уже купил другой игрок':e.msg||'Ошибка покупки')}}
function olOffline(){const b=olBase();return `<div class="empty">🌐 Нет связи с сервером онлайн-рынка.${b?'<br>Сервер: '+b.replace(/[<>&"]/g,''):'<br>Запустите server.js и откройте игру через него или впишите адрес сервера ниже.'}</div><div class="row" style="gap:8px"><input id="srv" placeholder="https://адрес-сервера" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;font:600 15px inherit"><button class="b" onclick="olConnect()">Подключить</button></div>`}
function olConnect(){const v=($('#srv').value||'').trim();if(!/^https?:\/\//.test(v))return toast('Адрес должен начинаться с http:// или https://');sset('bu_server',v);location.reload()}
function olShop(){const m=$('#ols').value,d=M[m],p=R(d.base*1.15);if(S.money<p)return toast('Не хватает денег');const l=mk(m),it={id:S.id++,m,ci:l.ci,cond:9,batt:100,seed:l.seed,rot:l.rot,paid:p,view:'back',listed:0,brk:[],box:1,imei:l.imei,bimei:l.imei,bl:0,fake:0,os:l.os,acct:l.acct||mkAcct(m)};fixI(it,1);S.money-=p;S.inv.push(it);save();toast('🏬 Куплено: '+d.n);render()}
function olHTML(){const sh='<div class="card"><div class="bd"><b>🏬 Магазин новых телефонов</b><div class="row" style="gap:8px;margin-top:6px"><select id="ols" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:600 14px inherit">'+Object.keys(M).sort((a,b)=>M[a].base-M[b].base).map(k=>`<option value="${k}">${M[k].n} — ${fmt(R(M[k].base*1.15))}</option>`).join('')+'</select><button class="b" onclick="olShop()">Купить</button></div></div></div>';if(!OL.ok)return sh+olOffline();const card=(l,m)=>{const it=l.item,d=M[it&&it.m];if(!d)return'';return`<div class="card"><div class="pic">${phone(it,'back')}</div><div class="bd"><div class="row"><b>${d.n}</b><span class="pr">${fmt(l.ask)}</span></div><div class="tags"><span>${(d.cols[it.ci]||d.cols[0])[0]}</span><span>Состояние ${+it.cond||0}/9</span><span>АКБ ${+it.batt||0}%</span>${it.box?'<span>📦 коробка</span>':''}</div><p class="mut">${d.spec}</p>${m?`<button class="b l" onclick="olCancel('${l.id}')">Снять с продажи</button>`:`<button class="b" ${S.money<l.ask?'disabled':''} onclick="olBuy('${l.id}')">Купить за ${fmt(l.ask)}</button>`}</div></div>`},mine=OL.list.filter(l=>!l.sold&&l.seller==OL.me),oth=OL.list.filter(l=>!l.sold&&l.seller!=OL.me).sort((a,b)=>b.ts-a.ts);return'<div class="mut">🌐 Онлайн-рынок: телефоны продают живые игроки, боты отключены. Чтобы выставить свой, откройте «Гараж» и нажмите «Продать».</div>'+sh+(mine.length?'<b>Ваши объявления</b>'+mine.map(l=>card(l,1)).join(''):'')+(oth.map(l=>card(l,0)).join('')||'<div class="empty">Пока никто не продаёт. Выставьте свой телефон первым!</div>')}
{const _r0=render;render=function(){_r0();if(S.tab=='feed')$('#main').innerHTML=olHTML()}}
olInit();if(ACC)olSetup();
</script></body></html>
